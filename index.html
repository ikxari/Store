<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ikxari - Designer Fashion Store</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap">
<style>
/* ===================================================================
   IKXARI — BEYOND FASHION · luxury pink · multi-page app + admin ERP
   Jost (bold, no italics) · small-caps · glow · rounded
   =================================================================== */
:root{
  --blush:#F5DCE5; --dusty:#D49AAE; --rose:#A64D70; --ivory:#FFF9F7;
  --charcoal:#29232A; --gold:#C5A16C;
  --bg:var(--ivory); --surface:#ffffff; --surface-2:#fcf3f6;
  --fg:var(--charcoal); --muted:#8a7a82; --line:#f0dfe6; --accent:var(--rose);
  --ok:#2e8b57; --warn:#c08a2a; --bad:#b23a5b;
  --shadow:0 20px 55px -24px rgba(41,35,42,.22);
  --glow:0 0 34px -6px color-mix(in srgb,var(--gold) 55%,transparent);
  --glow-rose:0 12px 34px -12px color-mix(in srgb,var(--rose) 72%,transparent);
  --r:16px; --r-sm:11px;
  --f:'Jost',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1b171c; --surface:#241f26; --surface-2:#2c2630;
  --fg:#f6eef1; --muted:#b29aa5; --line:#382f3c; --accent:#d98fb0; --gold:#d6ba82;
  --shadow:0 22px 60px -26px rgba(0,0,0,.72); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1b171c; --surface:#241f26; --surface-2:#2c2630;
  --fg:#f6eef1; --muted:#b29aa5; --line:#382f3c; --accent:#d98fb0; --gold:#d6ba82;
  --shadow:0 22px 60px -26px rgba(0,0,0,.72); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-weight:400;
  line-height:1.6;letter-spacing:.012em;font-style:normal;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--rose)}
em,i{font-style:normal;font-weight:700}
h1,h2,h3,h4{font-weight:700;margin:0;line-height:1.14;text-wrap:balance;letter-spacing:.01em;font-variant-caps:small-caps}
.name,nav.main a,.btn,.pill,.link,.mmenu a,.copy,.tab,.payopt .pt{font-variant-caps:small-caps}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.eyebrow{font-size:.64rem;letter-spacing:.34em;text-transform:uppercase;color:var(--accent);font-weight:600}
.wrap{max-width:1280px;margin:0 auto;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
img{max-width:100%;display:block}

/* loader */
#loader{position:fixed;inset:0;z-index:300;background:var(--bg);display:grid;place-items:center;transition:opacity .5s,visibility .5s}
#loader.gone{opacity:0;visibility:hidden}
.lmark{font-size:clamp(2rem,8vw,3.4rem);font-weight:700;letter-spacing:.42em;text-indent:.42em;
  background:linear-gradient(100deg,var(--muted) 20%,var(--gold) 50%,var(--muted) 80%);background-size:220% auto;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 2.4s linear infinite}
@keyframes sh{to{background-position:-220% center}}

/* announcement */
.announce{background:var(--rose);color:#fff;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;text-align:center;position:relative;font-weight:500}
.announce .wrap{padding-block:.5rem;padding-right:max(40px,env(safe-area-inset-right,0px))}
.announce button{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:#fff;font-size:1rem;opacity:.85}
.announce.hide{display:none}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:1.1rem;padding-block:.85rem}
.logo{display:inline-flex;align-items:center;gap:.65rem;line-height:1}
.logo .mk{width:38px;height:38px;flex:none;border:1.5px solid var(--gold);border-radius:10px;transform:rotate(45deg);
  display:grid;place-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 20%,transparent),transparent);box-shadow:var(--glow)}
.logo .mk b{transform:rotate(-45deg);font-size:.86rem;font-weight:700;color:var(--gold);letter-spacing:.03em}
.logo .wm{display:flex;flex-direction:column;line-height:1.05}
.logo .wm .nm{font-size:1.32rem;font-weight:700;letter-spacing:.34em;text-indent:.34em}
.logo .wm .sub{font-size:.46rem;font-weight:600;letter-spacing:.38em;color:var(--accent);margin-top:5px;display:flex;align-items:center;gap:.45rem;white-space:nowrap}
.logo .wm .sub::before,.logo .wm .sub::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.75}
.fcol .logo .nm{color:#fff} .fcol .logo .sub{color:var(--gold)} .fcol .logo .mk b{color:var(--gold)}
nav.main{display:flex;gap:1.5rem;margin:0 auto}
nav.main a{font-size:.85rem;letter-spacing:.06em;color:var(--muted);font-weight:600;transition:.2s;position:relative;padding:.2rem 0}
nav.main a:hover,nav.main a.on{color:var(--fg)}
nav.main a::after{content:"";position:absolute;left:0;bottom:-3px;width:0;height:2px;background:var(--accent);transition:.25s}
nav.main a:hover::after,nav.main a.on::after{width:100%}
.hicons{display:flex;gap:.3rem}
.ib{background:none;border:none;color:var(--fg);padding:.4rem;display:grid;place-items:center;position:relative}
.ib svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.5}
.count{position:absolute;top:-1px;right:-3px;background:var(--accent);color:#fff;font-size:.56rem;font-weight:700;
  min-width:16px;height:16px;border-radius:9px;display:grid;place-items:center;padding:0 3px}
.count[data-n="0"]{display:none}
.burger{display:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border:1px solid var(--accent);background:var(--accent);color:#fff;
  padding:.85rem 2.1rem;font-size:.82rem;letter-spacing:.08em;font-weight:700;border-radius:999px;
  box-shadow:var(--glow-rose);transition:transform .25s,box-shadow .25s,opacity .2s}
.btn:hover{transform:translateY(-2px);box-shadow:var(--glow-rose),var(--glow)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--accent)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--charcoal);box-shadow:var(--glow)}
.btn.block{width:100%}
.btn.sm{padding:.55rem 1.2rem;font-size:.72rem}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.link{font-size:.8rem;letter-spacing:.06em;color:var(--accent);font-weight:600;border-bottom:1px solid transparent;padding-bottom:2px}
.link:hover{border-color:var(--accent)}

/* sections */
.sec{padding-block:clamp(2.4rem,6vw,4rem)}
.sechead{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap}
.sechead h2{font-size:clamp(1.6rem,4.5vw,2.6rem)}
.sechead .eyebrow{display:block;margin-bottom:.4rem}
.crumbs{font-size:.72rem;color:var(--muted);letter-spacing:.04em;padding-top:1.2rem}
.crumbs a:hover{color:var(--accent)}

/* hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);background:linear-gradient(135deg,var(--blush),var(--surface-2))}
:root[data-theme="dark"] .hero{background:linear-gradient(135deg,#2a2230,var(--surface-2))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero{background:linear-gradient(135deg,#2a2230,var(--surface-2))}}
.hero .wrap{padding-block:clamp(3rem,9vw,6rem);display:grid;gap:1.2rem}
.hero h1{font-size:clamp(2.4rem,8vw,5rem);font-weight:700;max-width:14ch;text-shadow:0 2px 40px color-mix(in srgb,var(--rose) 26%,transparent)}
.hero h1 b{color:var(--accent)}
.hero p{max-width:46ch;color:var(--muted);font-size:1.05rem}
.hero .btn{justify-self:start;margin-top:.3rem}
.hero::after{content:"";position:absolute;right:-6%;top:-30%;width:40vw;height:150%;pointer-events:none;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--gold) 34%,transparent),transparent 70%);opacity:.6}

/* category tiles */
.cats{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.ctile{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:4/5;border:1px solid var(--line);box-shadow:var(--shadow)}
.ctile img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.ctile:hover img{transform:scale(1.06)}
.ctile b{position:absolute;inset-inline:0;bottom:0;background:linear-gradient(transparent,rgba(41,35,42,.75));color:#fff;
  padding:1.4rem .9rem .8rem;font-size:1.1rem;font-weight:700;font-variant-caps:small-caps;letter-spacing:.04em}

/* offers */
.offergrid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(248px,1fr))}
.offer{border:1.6px dashed var(--gold);border-radius:var(--r);padding:1.2rem 1.3rem;
  background:linear-gradient(135deg,color-mix(in srgb,var(--blush) 55%,var(--surface)),var(--surface));
  display:flex;flex-direction:column;gap:.5rem;box-shadow:var(--glow);position:relative;overflow:hidden}
.offer::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--gold) 40%,transparent),transparent);pointer-events:none}
.offer .ocode{display:flex;align-items:center;gap:.6rem}
@keyframes couponFlash{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--rose) 45%,transparent);transform:scale(1)}
  50%{box-shadow:0 0 0 7px transparent;transform:scale(1.05)}}
.offer code{font-family:var(--f);font-weight:700;letter-spacing:.14em;font-size:1.12rem;color:var(--rose);
  background:color-mix(in srgb,var(--rose) 11%,transparent);padding:.38rem .75rem;border-radius:var(--r-sm);
  animation:couponFlash 1.5s ease-in-out infinite}
.offer .odesc{font-size:.9rem;color:var(--fg);font-weight:500}
.offer .omin{font-size:.66rem;color:var(--muted);letter-spacing:.04em}
.copy{margin-left:auto;border:1px solid var(--gold);background:none;color:var(--gold);font-size:.68rem;letter-spacing:.08em;padding:.38rem .85rem;border-radius:999px;font-weight:700}
.copy:hover{background:var(--gold);color:var(--charcoal)}
.offer.ship{border-style:solid;border-color:var(--line);justify-content:center}
.offer.ship .big{font-size:1.15rem;font-weight:700;font-variant-caps:small-caps}

/* promo banner */
.promo{border-radius:var(--r);overflow:hidden;background:linear-gradient(120deg,var(--rose),var(--dusty));color:#fff;
  padding:clamp(2rem,5vw,3.4rem);display:grid;gap:.6rem;box-shadow:var(--glow-rose);position:relative}
.promo h2{color:#fff;font-size:clamp(1.6rem,4vw,2.4rem)}
.promo p{color:rgba(255,255,255,.9);max-width:50ch}
.promo .btn{justify-self:start;background:#fff;color:var(--rose);border-color:#fff;margin-top:.4rem}
/* image banner section */
.ibanner{position:relative;border-radius:var(--r);overflow:hidden;display:grid;align-items:center;box-shadow:var(--shadow);isolation:isolate}
.ibanner>img{position:absolute;inset:0;width:100%;height:100%;z-index:-2}
.ibanner::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(41,35,42,.72),rgba(41,35,42,.25))}
.ibanner .ib-in{padding:clamp(1.8rem,5vw,3.4rem);display:grid;gap:.6rem;max-width:620px;color:#fff}
.ibanner .ib-in h2{color:#fff} .ibanner .ib-in p{color:rgba(255,255,255,.92)}
.ibanner .ib-in .eyebrow{color:var(--gold)}
.ibanner .btn{justify-self:start;margin-top:.4rem}
/* richtext section (image + text) */
.richsec{display:grid;grid-template-columns:1fr 1fr;gap:2rem;align-items:center}
.richsec.right{direction:rtl} .richsec.right>*{direction:ltr}
.richsec .rimg{border-radius:var(--r);overflow:hidden;aspect-ratio:4/3;background:var(--surface-2);box-shadow:var(--shadow)}
.richsec .rimg img{width:100%;height:100%}
.richsec .rtxt{display:grid;gap:.6rem}
.richsec .rtxt p{color:var(--muted);line-height:1.8}
@media (max-width:760px){.richsec{grid-template-columns:1fr}}
/* admin section rows */
.secrow{display:flex;align-items:center;gap:.7rem;padding:.8rem 1rem;border-bottom:1px solid var(--line)}
.secrow:last-child{border-bottom:none}
.secrow .styp{font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;background:var(--surface-2);color:var(--muted);padding:.25rem .55rem;border-radius:20px;font-weight:700;flex:none}
.secrow .stit{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.secrow .ord{display:flex;gap:.2rem}
.imgprev{width:100%;aspect-ratio:16/7;border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2);border:1px solid var(--line);margin-top:.4rem}
.imgprev img{width:100%;height:100%}
.uprow{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.filebtn{border:1px dashed var(--dusty);border-radius:var(--r-sm);padding:.55rem .9rem;font-size:.74rem;color:var(--accent);font-weight:600;background:none}

/* grid + card */
.grid{display:grid;gap:1.4rem 1.1rem;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;
  transition:transform .3s,box-shadow .3s,border-color .3s}
.card:hover{transform:translateY(-5px);box-shadow:var(--shadow),var(--glow);border-color:var(--gold)}
.thumb{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--surface-2);cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .7s}
.card:hover .thumb img{transform:scale(1.05)}
.badges{position:absolute;top:.55rem;left:.55rem;display:flex;flex-direction:column;gap:.3rem;z-index:2}
.bdg{font-size:.54rem;letter-spacing:.14em;text-transform:uppercase;padding:.26rem .5rem;border-radius:6px;color:#fff;font-weight:700}
.bdg.new{background:var(--charcoal)} .bdg.sale{background:var(--accent)} .bdg.low{background:var(--gold);color:var(--charcoal)} .bdg.out{background:var(--muted)}
.heart{position:absolute;top:.5rem;right:.5rem;z-index:2;background:color-mix(in srgb,var(--surface) 78%,transparent);border:none;
  width:32px;height:32px;border-radius:50%;display:grid;place-items:center;backdrop-filter:blur(4px)}
.heart svg{width:16px;height:16px;stroke:var(--fg);fill:none;stroke-width:1.7}
.heart.on svg{fill:var(--accent);stroke:var(--accent)}
.quick{position:absolute;inset-inline:0;bottom:0;background:color-mix(in srgb,var(--charcoal) 84%,transparent);color:#fff;
  text-align:center;padding:.55rem;font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;font-weight:600;transform:translateY(100%);transition:.3s}
.thumb:hover .quick{transform:translateY(0)}
.meta{padding:.9rem .95rem 1.1rem;display:flex;flex-direction:column;gap:.26rem;flex:1}
.cat{font-size:.56rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600}
.name{font-size:1.1rem;font-weight:600;letter-spacing:.02em}
.dots{display:flex;gap:.26rem;margin:.1rem 0}
.dot{width:12px;height:12px;border-radius:50%;border:1px solid var(--line)}
.price{font-size:.95rem;font-weight:700;font-variant-numeric:tabular-nums;margin-top:.1rem}
.price s{color:var(--muted);font-size:.78rem;margin-right:.4rem;font-weight:400}
.price .off{color:var(--accent);font-size:.68rem;margin-left:.4rem;letter-spacing:.06em;font-weight:600}
.add{margin-top:.55rem;border:1px solid var(--fg);background:transparent;color:var(--fg);padding:.6rem;font-size:.64rem;
  letter-spacing:.14em;text-transform:uppercase;border-radius:999px;transition:.25s;font-weight:700}
.add:hover{background:var(--fg);color:var(--bg)}
.add:disabled{opacity:.4;cursor:not-allowed}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:3.5rem 1rem;font-size:1.2rem;font-weight:500}

/* shop layout */
.shoplay{display:grid;grid-template-columns:230px 1fr;gap:1.6rem;align-items:start}
.filters{position:sticky;top:90px;display:flex;flex-direction:column;gap:1.3rem;border:1px solid var(--line);border-radius:var(--r);padding:1.2rem;background:var(--surface)}
.fgroup h4{font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:.6rem}
.fopts{display:flex;flex-wrap:wrap;gap:.4rem}
.fopt{border:1px solid var(--line);background:none;color:var(--fg);padding:.4rem .7rem;border-radius:999px;font-size:.72rem;font-weight:500}
.fopt.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.shoptop{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center;margin-bottom:1.2rem}
.shoptop .cnt{color:var(--muted);font-size:.8rem;margin-right:auto}
.selbox,.searchbox{display:flex;align-items:center;gap:.5rem;border:1px solid var(--line);border-radius:999px;padding:.5rem .95rem;background:var(--surface)}
.selbox select{border:none;background:none;color:var(--fg);outline:none;font-size:.78rem;font-weight:500}
.searchbox input{border:none;background:none;color:var(--fg);outline:none;font-size:.85rem;width:150px;max-width:38vw}
.searchbox svg{width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:1.6;flex:none}
.fbtn{display:none}

/* product page */
.pd{display:grid;grid-template-columns:1fr 1fr;gap:2rem;align-items:start}
.pd-gallery{display:grid;gap:.7rem}
.pd-main{aspect-ratio:3/4;border-radius:var(--r);overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.pd-main img{width:100%;height:100%;object-fit:cover}
.pd-thumbs{display:flex;gap:.6rem;flex-wrap:wrap}
.pd-thumbs button{width:64px;height:80px;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2);padding:0}
.pd-thumbs button.on{border-color:var(--accent);box-shadow:var(--glow-rose)}
.pd-thumbs img{width:100%;height:100%;object-fit:cover}
.pd-info{display:flex;flex-direction:column;gap:.6rem;min-width:0}
.pd-info .name{font-size:2.1rem;font-weight:700}
.pd-info .price{font-size:1.4rem}
.pd-info .sku{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pd-info .desc{color:var(--muted);line-height:1.75;margin:.3rem 0}
.attrs{display:grid;grid-template-columns:auto 1fr;gap:.4rem 1rem;font-size:.85rem;margin:.5rem 0;color:var(--muted)}
.attrs b{color:var(--fg);font-weight:600}
.stockline{font-size:.78rem;letter-spacing:.04em;font-weight:600}
.stockline.ok{color:var(--ok)} .stockline.low{color:var(--warn)} .stockline.out{color:var(--bad)}
.opt{margin-top:.4rem}
.opt .lbl{font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:.45rem;font-weight:600}
.opt .lbl a{color:var(--accent)}
.chips{display:flex;gap:.45rem;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);min-width:40px;padding:.55rem .85rem;border-radius:var(--r-sm);font-size:.82rem;font-weight:500}
.chip.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.cdot{width:30px;height:30px;border-radius:50%;padding:0;border:2px solid var(--line)}
.cdot.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--accent)}
.qtybox{display:flex;align-items:center;gap:.6rem}
.qtybox button{width:30px;height:30px;border:1px solid var(--line);background:none;color:var(--fg);border-radius:8px;font-size:1rem}
.qtybox span{min-width:24px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}

/* cart / checkout page */
.cartlay{display:grid;grid-template-columns:1fr 340px;gap:1.6rem;align-items:start}
.lines{display:flex;flex-direction:column;gap:1rem}
.line{display:flex;gap:1rem;border:1px solid var(--line);border-radius:var(--r);padding:.9rem;background:var(--surface)}
.line img{width:84px;height:106px;border-radius:var(--r-sm);object-fit:cover;flex:none}
.linfo{flex:1;min-width:0}
.linfo .nm{font-size:1.1rem;font-weight:600}
.linfo .vr{font-size:.74rem;color:var(--muted);letter-spacing:.04em}

function svgURI(p){

    Tailoring:["#CBB79E","#A6886A"],Accessories:["#EBD9B4","#C5A16C"],Footwear:["#D9C2CB","#A64D70"]};
  const [a,b]=pal[p.cat]||["#F5DCE5","#D49AAE"];

}

/* ---------- cart math ---------- */
const key=(id,sz,cl)=>`${id}|${sz}|${cl}`;
function bagQty(){return Object.values(bag).reduce((a,b)=>a+b,0);}
function bagSub(){return Object.entries(bag).reduce((s,[k,q])=>{const p=P(k.split("|")[0]);return s+(p?p.price*q:0);},0);}
let coupon=DB.get("coupon",null);
function discount(sub){ if(!coupon)return 0; const c=coupons[coupon]; if(!c||sub<c.min)return 0;
  return c.type==="pct"?sub*c.value/100:Math.min(c.value,sub); }
function shipCost(sub){ const after=sub-discount(sub); return after>=S().shipping.freeOver?0:S().shipping.flat; }
function addBag(id,sz,cl,q){bag[key(id,sz,cl)]=(bag[key(id,sz,cl)]||0)+q;persistCart();syncCounts();}
function setBag(k,d){bag[k]=(bag[k]||0)+d;if(bag[k]<=0)delete bag[k];persistCart();syncCounts();}
function rmBag(k){delete bag[k];persistCart();syncCounts();}
function toggleWish(id){wish.has(id)?wish.delete(id):wish.add(id);persistCart();syncCounts();}
function syncCounts(){const b=bagQty(),w=wish.size;
  $("#bagCount").textContent=b;$("#bagCount").dataset.n=b;$("#wishCount").textContent=w;$("#wishCount").dataset.n=w;}

function renderShopGrid(){
  const q=shopQ.toLowerCase();
  let list=live().filter(p=>{
    const mc=shopCat==="All"||(shopCat==="New"?p.tags.includes("new"):shopCat==="Sale"?(p.old>0||p.tags.includes("sale")):p.cat===shopCat);
    const ms=!shopSize||p.sizes.includes(shopSize);
    const mcl=!shopColour||p.colours.some(c=>c.name===shopColour);
    const mq=!q||p.name.toLowerCase().includes(q)||p.cat.toLowerCase().includes(q)||p.sku.toLowerCase().includes(q);
    return mc&&ms&&mcl&&mq;
  });
  const srt={lo:(a,b)=>a.price-b.price,hi:(a,b)=>b.price-a.price,az:(a,b)=>a.name.localeCompare(b.name),
    new:(a,b)=>b.tags.includes("new")-a.tags.includes("new"),feat:(a,b)=>b.tags.includes("featured")-a.tags.includes("featured")};
  list.sort(srt[shopSort]||srt.feat);
  const g=$("#shopGrid"); if(g)g.innerHTML=list.length?list.map(card).join(""):`<div class="empty">No pieces match your filters.</div>`;
  const c=$("#shopCnt"); if(c)c.textContent=`${list.length} piece${list.length!==1?"s":""}`;
}

let lastOrder=null;
function placeOrder(){
  const g=id=>($("#"+id).value||"").trim();
  const name=g("coName"),phone=g("coPhone"),email=g("coEmail"),addr=g("coAddr"),city=g("coCity"),pin=g("coPin"),err=$("#coErr");
  if(!name||!phone||!addr||!city||!pin){err.textContent="Please fill name, phone, address, city and PIN.";return;}
  if(!/^\d{6}$/.test(pin)){err.textContent="PIN code must be 6 digits.";return;}
  if(!/^\d{10}$/.test(phone.replace(/\D/g,"").slice(-10))){err.textContent="Enter a valid 10-digit phone.";return;}
  if(payMethod==="razorpay"){ if(!S().razorpay.enabled||!S().razorpay.keyId){err.textContent="Online payment isn't enabled yet. Please choose Cash on Delivery.";return;} err.textContent="Razorpay pending host + keys.";return; }
  const express=$("#coDeliv").value==="exp",sub=bagSub(),disc=discount(sub); let ship=shipCost(sub); if(express)ship+=S().shipping.expressAdd;
  const tot=sub-disc+ship;
  const items=Object.entries(bag).map(([k,q])=>{const[id,sz,cl]=k.split("|"),p=P(id);return{id,name:p?p.name:id,sz,cl,qty:q,price:p?p.price:0};});
  // reduce stock (local)
  items.forEach(it=>{const p=P(it.id);if(p)p.stock=Math.max(0,p.stock-it.qty);}); saveProducts();
  const oid=`IKX${Date.now().toString().slice(-6)}${Math.floor(Math.random()*90+10)}`;
  const order={oid,when:Date.now(),status:"Received",pay:"COD",name,phone,email,addr,city,pin,delivery:express?"Express":"Standard",items,sub,disc,coupon,ship,tot};
  orders.unshift(order); saveOrders();
  if($("#coSave")&&$("#coSave").checked){ user={name,phone,email,addr,city,pin}; saveUser(); }
  lastOrder=order; bag={}; coupon=null; DB.set("coupon",null); persistCart(); syncCounts();
  go("confirm");
}

  if(!lastOrder){return go("home");}

  o.items.forEach(it=>msg+=`• ${it.name} (${it.sz}/${it.cl}) ×${it.qty} — ${money(it.price*it.qty)}%0A`);
  msg+=`%0ASubtotal: ${money(o.sub)}`; if(o.disc>0)msg+=`%0ADiscount (${o.coupon}): −${money(o.disc)}`;

function wireUpload(fileId,urlId,prevId){
  const f=$("#"+fileId); if(!f)return;
  f.onchange=()=>{const file=f.files[0];if(!file)return;

    r.onload=()=>{$("#"+urlId).value=r.result;const p=$("#"+prevId);if(p)p.innerHTML=`<img src="${r.result}" style="object-fit:cover">`;};
    r.readAsDataURL(file);};
}

document.addEventListener("click",e=>{
  const cp=e.target.closest("[data-copy]"); if(cp){e.preventDefault();const t=cp.textContent;navigator.clipboard?.writeText(cp.dataset.copy).then(()=>{cp.textContent="Copied";setTimeout(()=>cp.textContent=t,1500);},()=>{cp.textContent="Hold";}); return;}
  const w=e.target.closest("[data-wish]"); if(w){e.preventDefault();toggleWish(w.dataset.wish);
    const h=w.closest(".heart"); if(h)h.classList.toggle("on",wish.has(w.dataset.wish));
    if((location.hash.replace("#",""))==="wishlist")viewWishlist(); toast(wish.has(w.dataset.wish)?"Saved to wishlist":"Removed"); return;}
  const v=e.target.closest("[data-view]"); if(v){e.preventDefault();go("p-"+v.dataset.view);return;}
  const fc=e.target.closest("[data-fcat]"); if(fc){shopCat=fc.dataset.fcat;viewShop();return;}
  const fs=e.target.closest("[data-fsize]"); if(fs){shopSize=shopSize===fs.dataset.fsize?"":fs.dataset.fsize;viewShop();return;}
  const fl=e.target.closest("[data-fcol]"); if(fl){shopColour=shopColour===fl.dataset.fcol?"":fl.dataset.fcol;viewShop();return;}
  const bq=e.target.closest("[data-bq]"); if(bq){setBag(bq.dataset.k,+bq.dataset.bq);viewBag();return;}
  const br=e.target.closest("[data-brm]"); if(br){rmBag(br.dataset.brm);viewBag();return;}
  const cat=e.target.closest("[data-cat]"); if(cat){e.preventDefault();shopCat=cat.dataset.cat;shopSize="";shopColour="";go("shop");return;}
  const cl=e.target.closest("[data-close]"); if(cl){closeModal();return;}
});

/* ---------- menus / header ---------- */
function closeMenus(){ $("#mmenu").classList.remove("show"); }
$("#burger").onclick=()=>{ $("#mmenu").innerHTML=`<button class="x" data-mclose>×</button>`+$("#navMain").innerHTML+`<a href="#wishlist">Wishlist</a><a href="#bag">Bag</a><a href="#account">Account</a>`; $("#mmenu").classList.add("show"); };
$("#mmenu").addEventListener("click",e=>{ if(e.target.closest("[data-mclose]")||e.target.tagName==="A")closeMenus(); });
$("#searchToggle").onclick=()=>{go("shop");setTimeout(()=>$("#search")&&$("#search").focus(),300);};
$("#announceX").onclick=()=>$("#announce").classList.add("hide");
$("#adminLink").onclick=()=>go("admin");
$("#themeBtn").onclick=()=>{const c=document.documentElement.getAttribute("data-theme");const dark=c?c==="dark":matchMedia("(prefers-color-scheme:dark)").matches;document.documentElement.setAttribute("data-theme",dark?"light":"dark");};

/* ---------- branding ---------- */
function applyBranding(){
  const s=S(); document.title=s.brand;
  $("#lmark").textContent=s.brand; $("#announceTxt").textContent=s.announce;
  $("#footAbout").textContent=s.storyText;
  $("#footCopy").textContent=`© ${new Date().getFullYear()} ${s.brand} · ${s.taxNote}`;
  $("#footSocial").textContent=`${s.instagram} · ${s.email}`;
  const init=s.brand.replace(/[^A-Za-z]/g,"").slice(0,2).toUpperCase()||"IK";
  $$(".logo .nm").forEach(x=>x.textContent=s.brand); $$(".logo .sub").forEach(x=>x.textContent=s.tagline);
  $$(".logo .mk b").forEach(x=>x.textContent=init);
  if(location.hash.replace("#","")==="home"||!location.hash)viewHome();
}

/* ---------- init ---------- */
applyBranding(); syncCounts();
window.addEventListener("hashchange",route);
route();
window.addEventListener("load",()=>setTimeout(()=>$("#loader").classList.add("gone"),500));
setTimeout(()=>$("#loader").classList.add("gone"),2400);
</script>

</body></html>
